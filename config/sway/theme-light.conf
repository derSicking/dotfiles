# Latte (light) — Catppuccin title bar colors
# These only show in tabbed/stacked layouts (default_border = none)
#
# Format:  client.<state> <border> <background> <text> <indicator> <child_border>
#
client.focused          #ccd0da #ccd0da #4c4f69 #ccd0da #ccd0da
client.focused_inactive #bcc0cc #e6e9ef #6c6f85 #9ca0b0 #bcc0cc
client.unfocused        #bcc0cc #dce0e8 #8c8fa1 #bcc0cc #bcc0cc
client.urgent           #d20f39 #ccd0da #d20f39 #d20f39 #d20f39
client.background       #eff1f5
