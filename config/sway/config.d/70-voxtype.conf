# Voxtype dictation (https://voxtype.io)
# Right Ctrl toggles recording; the transcript opens in a floating ghostty
# running nvim. F12 cancels a recording.
# Undo: delete this file and ~/.dotfiles/local-bin/scripts/dictate, reload sway.

bindsym Control_R exec dictate
bindsym F12 exec voxtype record cancel

# Float only the transcript window (matched by its pinned title)
for_window [title="voxtype-dictation"] {
    floating enable
    resize set 1200 800
    move position center
}
