# Apps

# Personal browsing goes to the Ears-Only bus, so it never reaches the stream.
# Takes effect on a fresh browser start: Chrome reuses an already running
# instance for the same profile, inheriting whatever sink that instance has.
bindsym $mod+g exec env PULSE_SINK=Ears-Only google-chrome
bindsym $mod+e exec thunar
bindsym $mod+period exec rofimoji

# Control
bindsym Pause exec playerctl play-pause
