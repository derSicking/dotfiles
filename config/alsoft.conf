# OpenAL Soft configuration.
#
# OpenAL's PipeWire backend can link its output ports directly to a hardware
# device, bypassing the session manager. Audio routed that way never enters
# the streaming bus, so OBS does not see it.
#
# Routing through the PulseAudio/PipeWire server instead makes OpenAL a normal
# client: it follows the default sink (Stream-Game) and is captured like any
# other application. The trailing comma keeps the other backends as fallbacks.

[general]
drivers = pulse,
