# Streaming audio buses.
#
# Each bus is a null sink: applications play into it, and two independent
# taps read from it. Its monitor source is what OBS captures, while a
# loopback into the Scarlett is what you hear. Because the two taps are
# separate, stream level and headphone level stay independent — music can
# stream at full level while its loopback is muted, or the reverse.
#
# The loopback playback target refers to the Scarlett by node name. Moving
# the interface to a different USB port renames it, and every loopback
# below would silently stop carrying audio; update them together.

context.objects = [
    { factory = adapter
      args = {
          factory.name     = support.null-audio-sink
          node.name        = "Stream-Game"
          node.description = "Stream: Game"
          media.class      = "Audio/Sink"
          object.linger    = true
          audio.position   = [ FL FR ]
      }
    }
    { factory = adapter
      args = {
          factory.name     = support.null-audio-sink
          node.name        = "Stream-Music"
          node.description = "Stream: Music"
          media.class      = "Audio/Sink"
          object.linger    = true
          audio.position   = [ FL FR ]
      }
    }
    { factory = adapter
      args = {
          factory.name     = support.null-audio-sink
          node.name        = "Stream-Browser"
          node.description = "Stream: Browser"
          media.class      = "Audio/Sink"
          object.linger    = true
          audio.position   = [ FL FR ]
      }
    }
    { factory = adapter
      args = {
          factory.name     = support.null-audio-sink
          node.name        = "Ears-Only"
          node.description = "Ears only"
          media.class      = "Audio/Sink"
          object.linger    = true
          audio.position   = [ FL FR ]
      }
    }
]

context.modules = [
    { name = libpipewire-module-loopback
      args = {
          node.name        = "monitor-stream-game"
          node.description = "Game to headphones"
          capture.props = {
              target.object       = "Stream-Game"
              stream.capture.sink = true
              node.passive        = true
              audio.position      = [ FL FR ]
          }
          playback.props = {
              target.object  = "alsa_output.usb-Focusrite_Scarlett_2i2_USB_Y8UN41U167C9BD-00.HiFi__Line__sink"
              node.passive   = true
              audio.position = [ FL FR ]
          }
      }
    }
    { name = libpipewire-module-loopback
      args = {
          node.name        = "monitor-stream-music"
          node.description = "Music to headphones"
          capture.props = {
              target.object       = "Stream-Music"
              stream.capture.sink = true
              node.passive        = true
              audio.position      = [ FL FR ]
          }
          playback.props = {
              target.object  = "alsa_output.usb-Focusrite_Scarlett_2i2_USB_Y8UN41U167C9BD-00.HiFi__Line__sink"
              node.passive   = true
              audio.position = [ FL FR ]
          }
      }
    }
    { name = libpipewire-module-loopback
      args = {
          node.name        = "monitor-stream-browser"
          node.description = "Browser to headphones"
          capture.props = {
              target.object       = "Stream-Browser"
              stream.capture.sink = true
              node.passive        = true
              audio.position      = [ FL FR ]
          }
          playback.props = {
              target.object  = "alsa_output.usb-Focusrite_Scarlett_2i2_USB_Y8UN41U167C9BD-00.HiFi__Line__sink"
              node.passive   = true
              audio.position = [ FL FR ]
          }
      }
    }
    { name = libpipewire-module-loopback
      args = {
          node.name        = "monitor-ears-only"
